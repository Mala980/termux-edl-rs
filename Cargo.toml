[package]
name = "termux-edl-rs"
version = "0.1.0"
edition = "2021"
description = "Rust rewrite of the termux-edl Qualcomm Sahara / Firehose EDL client (branch termux-edl)"
license = "GPL-3.0"
repository = "https://github.com/Mala980/termux-edl-rs"

[[bin]]
name = "edl-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
rusb = "0.9"
libc = "0.2"
bitreader = "0.3"
clap = { version = "4.6.10", features = ["derive"] }
