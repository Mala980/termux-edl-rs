name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Android/Termux — Android NDK cross-compile (aarch64 + armv7)
          - target: aarch64-linux-android
            host: ubuntu-latest
            ndk: true
          - target: armv7-linux-androideabi
            host: ubuntu-latest
            ndk: true
          # Linux ARM
          - target: aarch64-unknown-linux-musl
            host: ubuntu-latest
          - target: armv7-unknown-linux-gnueabihf
            host: ubuntu-latest
            gnu_cross: true
          # Linux x86_64 (bonus, for testing)
          - target: x86_64-unknown-linux-musl
            host: ubuntu-latest
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install zig + cargo-zigbuild (musl/gnu-cross targets)
        if: contains(matrix.target, 'musl') || contains(matrix.target, 'gnueabihf')
        run: |
          pip install ziglang
          cargo install cargo-zigbuild
      - name: Fix zig include path for libusb (musl)
        if: contains(matrix.target, 'musl')
        run: |
          ZIGVER=$(python3 -c "import ziglang,os;print(os.path.dirname(ziglang.__file__))")
          echo "ZIGLIB=$ZIGVER" >> $GITHUB_ENV
          mkdir -p $HOME/bin
          mkdir -p wrappers
          for T in x86_64-linux-musl aarch64-linux-musl; do
            BASE=$(echo $T | sed 's/-linux-musl//')
            printf '#!/usr/bin/env python3\nimport os, sys\nargv = [a for a in sys.argv[1:] if not a.startswith("--target=")]\nos.execvp("python3", ["python3", "-m", "ziglang", "cc", "-target", "%s"] + argv)\n' "$T" > wrappers/${BASE}-unknown-linux-musl-cc
            chmod +x wrappers/${BASE}-unknown-linux-musl-cc
          done
          echo "WRAPPER_DIR=$PWD/wrappers" >> $GITHUB_ENV
      - name: Install Android NDK + linux-headers
        if: matrix.ndk
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d
      - name: Configure Android NDK linker
        if: matrix.ndk
        env:
          CC_aarch64_linux_android: aarch64-linux-android-clang
          CC_armv7_linux_androideabi: armv7-linux-androideabi-clang
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          AR_armv7_linux_androideabi: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
        run: |
          sudo apt-get update -y && sudo apt-get install -y linux-headers-generic >/dev/null 2>&1 || true
          echo "LINH=$(ls -d /usr/src/linux-headers-*-generic* 2>/dev/null | head -1)" >> $GITHUB_ENV
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          echo "NDKSYS=$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot" >> $GITHUB_ENV
          if [ "${{ matrix.target }}" = "aarch64-linux-android" ]; then
            TRIPLE=aarch64-linux-android; API=24
          else
            TRIPLE=armv7a-linux-androideabi; API=24
          fi
          mkdir -p .cargo $HOME/bin
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # cc crate expects <triple>-clang; newer NDK ships <triple><api>-clang
          if [ "$TRIPLE" = "armv7a-linux-androideabi" ]; then
            CCNAME=arm-linux-androideabi
          else
            CCNAME=$TRIPLE
          fi
          ln -sf "$BIN/${TRIPLE}${API}-clang" "$HOME/bin/${CCNAME}-clang"
          ln -sf "$BIN/clang" "$HOME/bin/clang"
          echo "$HOME/bin" >> $GITHUB_PATH
          cat >> .cargo/config.toml <<EOF
          [target.${{ matrix.target }}]
          linker = "$BIN/${TRIPLE}${API}-clang"
          ar = "$BIN/llvm-ar"
          EOF
      - name: Build release
        env:
          CC_aarch64_linux_android: aarch64-linux-android-clang
          CC_armv7_linux_androideabi: arm-linux-androideabi-clang
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          AR_armv7_linux_androideabi: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CFLAGS_aarch64_linux_android: --sysroot=${{ env.NDKSYS }} -isystem ${{ env.LINH }}/include/uapi -isystem ${{ env.LINH }}/arch/arm64/include/uapi -isystem ${{ env.LINH }}/arch/arm64/include/generated/uapi -DHAVE_LINUX_MAGIC_H
          CFLAGS_armv7_linux_androideabi: --sysroot=${{ env.NDKSYS }} -isystem ${{ env.LINH }}/include/uapi -isystem ${{ env.LINH }}/arch/arm/include/uapi -isystem ${{ env.LINH }}/arch/arm/include/generated/uapi -DHAVE_LINUX_MAGIC_H
          LDFLAGS_aarch64_linux_android: --sysroot=${{ env.NDKSYS }}
          LDFLAGS_armv7_linux_androideabi: --sysroot=${{ env.NDKSYS }}
          # musl builds compile vendored libusb; needs linux headers on include path
          CFLAGS_aarch64_unknown_linux_musl: -I${{ env.ZIGLIB }}/libc/include/aarch64-linux-musl -I${{ env.ZIGLIB }}/libc/include/generic-musl
          CFLAGS_x86_64_unknown_linux_musl: -I${{ env.ZIGLIB }}/libc/include/x86_64-linux-musl -I${{ env.ZIGLIB }}/libc/include/generic-musl
          CC_aarch64_unknown_linux_musl: ${{ env.WRAPPER_DIR }}/aarch64-unknown-linux-musl-cc
          CC_x86_64_unknown_linux_musl: ${{ env.WRAPPER_DIR }}/x86_64-unknown-linux-musl-cc
        run: |
          if [ "${{ contains(matrix.target, 'musl') }}" = "true" ] || [ -n "${{ matrix.gnu_cross }}" ]; then
            cargo zigbuild --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/edl-rs dist/edl-rs-${{ matrix.target }}
          file dist/edl-rs-${{ matrix.target }} || true
      - uses: actions/upload-artifact@v5
        with:
          name: edl-rs-${{ matrix.target }}
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Compress binaries
        run: cd dist && for f in edl-rs-*; do gzip -k "$f"; done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
